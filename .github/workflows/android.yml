# Gera o app Android: um APK de teste (para instalar no celular) e o pacote .aab (para a Google Play).
# Para rodar: aba Actions -> "App Android" -> Run workflow.
name: App Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Chaves públicas do Supabase
        run: |
          cat > .env.production <<'ENV'
          VITE_SUPABASE_URL=https://cpqadyttczpmhbmimhuc.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_S_z9kxrM2SzhxK5zj-9itQ_H5dxo-0F
          ENV
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Número da versão (sobe a cada execução, a Play exige)
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Preparar chave de assinatura
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem chave de assinatura: o .aab sairá SEM assinatura e não serve para a Play."
          fi

      - name: Pacote para a Play (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: solo-contest-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solo-contest-aab-play
          path: android/app/build/outputs/bundle/release/app-release*.aab
